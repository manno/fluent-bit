name: Build SUSE Image

on:
  push:
    branches: [rancher-main]
    tags: ['v*']
  pull_request_target:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request_target'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAGS="${{ env.REGISTRY }}/${{ github.repository }}:${VERSION}-suse1"
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ github.repository }}:latest"
          else
            TAGS="${{ env.REGISTRY }}/${{ github.repository }}:dev-$(git rev-parse --short HEAD)"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.suse
          target: production
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ github.event_name != 'pull_request_target' }}
          # PRs build but don't push; docker/build-push-action handles the load/push branching
          cache-from: type=gha,scope=fluent-bit
          cache-to: type=gha,mode=max,scope=fluent-bit
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=SUSE Rancher

      - name: Dispatch image update to ob-team-charts
        if: github.ref == 'refs/heads/rancher-main' && github.event_name != 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.CHARTS_DISPATCH_TOKEN }}
        run: |
          TAG="dev-$(git rev-parse --short HEAD)"
          gh api repos/manno/ob-team-charts/dispatches \
            -f event_type=image-updated \
            -f "client_payload[component]=fluent-bit" \
            -f "client_payload[tag]=${TAG}"
