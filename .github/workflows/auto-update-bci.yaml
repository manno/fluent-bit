name: Auto-Update SUSE BCI

# Tracks digests for BOTH base images used by Dockerfile.suse:
#   - bci-base    (builder + debug stages)
#   - bci-minimal (production stage)
# Single PR bumps both when either drifts.

on:
  schedule:
    - cron: '13 12 * * *'  # Daily at 12:13 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: rancher-main

      - uses: docker/setup-buildx-action@v4

      - name: Check and update BCI digests
        id: update
        run: |
          set -euo pipefail

          NEEDS_UPDATE=false
          DIFF_LINES=""

          for variant in bci-base bci-minimal; do
            LATEST=$(docker buildx imagetools inspect \
                     "registry.suse.com/bci/${variant}:latest" \
                     --format '{{json .}}' | jq -r '.manifest.digest')

            if grep -qE "^FROM registry\\.suse\\.com/bci/${variant}.*@sha256:" Dockerfile.suse; then
              CURRENT=$(grep -E "^FROM registry\\.suse\\.com/bci/${variant}" Dockerfile.suse | head -1 \
                        | sed -nE 's|.*@(sha256:[a-f0-9]+).*|\1|p')
            else
              CURRENT="unpinned"
            fi

            echo "${variant}: current=${CURRENT} latest=${LATEST}"

            if [ "${CURRENT}" != "${LATEST}" ]; then
              NEEDS_UPDATE=true
              DIFF_LINES="${DIFF_LINES}- **${variant}**: \`${CURRENT}\` → \`${LATEST}\`%0A"
              # Update all FROM lines for this variant, preserving the trailing "AS <stage>" part
              sed -i -E "s|(FROM registry\\.suse\\.com/bci/${variant})(:latest|@sha256:[a-f0-9]+)?|\\1@${LATEST}|g" Dockerfile.suse
            fi
          done

          echo "needs_update=${NEEDS_UPDATE}" >> "$GITHUB_OUTPUT"
          {
            echo "diff_lines<<EOF"
            printf '%s\n' "${DIFF_LINES}" | tr '%0A' '\n'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        if: steps.update.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIFF_LINES: ${{ steps.update.outputs.diff_lines }}
        run: |
          set -euo pipefail

          BRANCH="auto-update-suse-bci"
          DATE=$(date -u +%Y-%m-%d)
          TITLE="chore: update SUSE BCI base images (${DATE})"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "${BRANCH}"

          git add Dockerfile.suse
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "${TITLE}"
          git push -f origin "${BRANCH}"

          cat > pr-body.md <<EOF
          ## Automated SUSE BCI Base Image Update

          Both BCI variants tracked by Dockerfile.suse:

          ${DIFF_LINES}

          Rebuilding picks up OS-level security fixes for the production
          (bci-minimal) runtime and the builder + debug (bci-base) stages.

          ---
          🤖 Generated by [auto-update-bci](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          EOF

          EXISTING=$(gh pr list --head "${BRANCH}" --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            gh pr edit "${EXISTING}" \
              --title "${TITLE}" \
              --body-file pr-body.md
            echo "Updated existing PR #${EXISTING}"
          else
            gh pr create \
              --title "${TITLE}" \
              --body-file pr-body.md \
              --base rancher-main \
              --head "${BRANCH}" \
              --label "dependencies" \
              --label "automated" \
              --label "suse-bci-update"
          fi
